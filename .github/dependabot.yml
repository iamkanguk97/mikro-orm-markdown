version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 5
    ignore:
      # The Vitest suite runs against MikroORM v6 fixtures; v7 is verified by
      # scripts/pack-smoke.mjs against the packed tarball. Auto-bumping the
      # dev dependency to v7 would silently drop v6 coverage.
      - dependency-name: '@mikro-orm/*'
        update-types: ['version-update:semver-major']
      # Node types stay pinned to the package's minimum supported runtime
      # (Node 22) so src/ cannot compile against newer Node APIs.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Vitest 5 runs on Vite 8, whose oxc transformer imports the legacy
      # decorator helper from a virtual module instead of inlining it. MikroORM
      # derives each entity's source path from the __decorate stack frame, so
      # every decorator fixture resolves to that virtual id and metadata loading
      # fails (57 tests). Stay on Vitest 4 / Vite 7 until MikroORM copes with
      # it, then drop these three entries and the explicit vite devDependency.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
    groups:
      mikro-orm:
        patterns:
          - '@mikro-orm/*'
      typescript-tooling:
        patterns:
          - 'typescript'
          - 'tsup'
          - 'tsx'
          - '@typescript-eslint/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vite'
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - '*'
