<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mikro-orm-markdown — showcase</title>
    <meta
      name="description"
      content="See the Mermaid ERD and Markdown documentation that mikro-orm-markdown generates from MikroORM entities."
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>mikro-orm-markdown</h1>
        <p class="tagline">Mermaid ERD + Markdown docs, generated straight from your MikroORM entities.</p>
      </div>
      <nav class="site-links">
        <a href="https://github.com/iamkanguk97/mikro-orm-markdown">GitHub</a>
        <a href="https://www.npmjs.com/package/mikro-orm-markdown">npm</a>
      </nav>
    </header>

    <nav id="tabs" class="tabs" aria-label="Scenarios"></nav>
    <p id="blurb" class="blurb"></p>

    <main class="panes">
      <section class="pane">
        <div class="pane-head">
          <h2>Entity sources</h2>
          <select id="file-picker" aria-label="Entity file"></select>
        </div>
        <pre class="code-pane"><code id="source-code" class="language-typescript"></code></pre>
      </section>
      <section class="pane">
        <div class="pane-head">
          <h2>Generated document</h2>
        </div>
        <article id="output" class="output-pane"></article>
      </section>
    </main>

    <footer class="site-footer">
      Every document on this page is generated by the actual CLI at build time — nothing is hand-written.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
